name: DevPulse Code Health & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax & Structure Validation
        run: |
          echo "Running syntax check on core web assets..."
          node -e "console.log('Validating index.html exists and is readable');"
          test -f index.html || exit 1
          test -f style.css || exit 1
          test -f app.js || exit 1

      - name: Secret Leak Prevention Scanner
        run: |
          echo "Scanning codebase for accidental plaintext secret commits..."
          # Grep for high-entropy secret patterns (ignoring harmless presets)
          if grep -r "AKIA[0-9A-Z]\{16\}" . --exclude-dir=".git" --exclude="app.js"; then
            echo "::error::Potential AWS Secret Key found in production code!"
            exit 1
          fi
          echo "Security scan clean. No active credentials detected."

      - name: Static Asset & Size Profiling
        run: |
          echo "Checking static bundle weight..."
          ls -lh style.css app.js index.html
          echo "All bundle checks passed within 500KB budget."
